<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorbo · Portal del proveedor — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--surface:#fff;--surface2:#fafafa;--surface3:#f0f0f0;
  --gold:#f5a623;--gold-bright:#ffb840;--gold-deep:#a05f00;--gold-dim:#fff3d6;
  --gold-bd:#f1c97b;--gold-bd-h:#f5a623;
  --text:#111;--muted:#666;--dim:#999;--border:#e5e5e5;--red:#d33;--red-dim:#fdecec;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;--display:'Syne',var(--sans);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--sans);color:var(--text);
  background:radial-gradient(120% 90% at 50% -10%,#fff7e8 0%,#fff 55%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
.lg-card{
  width:100%;max-width:420px;background:var(--surface);border:1px solid var(--gold-bd);
  border-radius:18px;padding:2.4rem 2rem 2rem;box-shadow:0 18px 50px rgba(0,0,0,.12);
  position:relative;overflow:hidden;animation:popIn .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{0%{opacity:0;transform:scale(.96) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.lg-brand{text-align:center;margin-bottom:1.6rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.lg-logo{height:48px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(245,166,35,.25));margin-bottom:8px}
.lg-tag{font-family:var(--display);font-size:.7rem;font-weight:700;color:var(--gold);letter-spacing:.28em;text-transform:uppercase;background:var(--gold-dim);border:1px solid var(--gold-bd);padding:.32rem .8rem;border-radius:20px}
.lg-hint{font-size:.72rem;color:var(--dim);letter-spacing:.03em;margin-top:.5rem;line-height:1.5}
.lg-form{display:flex;flex-direction:column;gap:.95rem;margin-top:.4rem}
.lg-field{display:flex;flex-direction:column;gap:.35rem}
.lg-label{font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding-left:.2rem}
.lg-input{background:#15151e;border:1px solid var(--border);border-radius:11px;padding:.8rem 1rem;color:#fff;font-family:var(--sans);font-size:.92rem;caret-color:#fff;outline:none;transition:border-color .18s}
.lg-input::placeholder{color:#888}
.lg-input:focus{border-color:var(--gold-bd-h)}
.lg-input:-webkit-autofill,.lg-input:-webkit-autofill:hover,.lg-input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;caret-color:#fff;-webkit-box-shadow:0 0 0 1000px #15151e inset;box-shadow:0 0 0 1000px #15151e inset;transition:background-color 9999s ease-in-out 0s}
.lg-err{display:none;align-items:center;gap:.5rem;background:var(--red-dim);border:1px solid rgba(224,101,79,.28);color:var(--red);padding:.6rem .85rem;border-radius:9px;font-size:.78rem;font-weight:600}
.lg-err.show{display:flex}
.lg-submit{margin-top:.5rem;width:100%;background:linear-gradient(135deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));color:#1a1408;border:none;border-radius:12px;padding:.9rem 1rem;font-family:var(--sans);font-size:.92rem;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:opacity .2s,transform .1s;box-shadow:0 8px 24px rgba(233,196,106,.22)}
.lg-submit:hover{opacity:.93}.lg-submit:active{transform:scale(.98)}
.lg-submit:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.lg-foot{margin-top:1.3rem;font-size:.66rem;color:var(--dim);text-align:center;letter-spacing:.06em;font-family:var(--display);font-weight:500;text-transform:uppercase}
@media (max-width:480px){.lg-card{padding:2rem 1.3rem 1.5rem}.lg-logo{height:40px}}
</style>
</head>
<body>
<div class="lg-card">
  <div class="lg-brand">
    <img class="lg-logo" src="https://cdn.shopify.com/s/files/1/0668/0081/2327/files/Titulo_secundario-3.png?v=1779814975" alt="ZORBO">
    <span class="lg-tag">Portal del proveedor</span>
    <span class="lg-hint">Entrá con el usuario y clave que te asignó Zorbo<br>para ver el rendimiento de tu marca.</span>
  </div>

  <form class="lg-form" id="loginForm" autocomplete="on">
    <div class="lg-err" id="err" role="alert"><span>⚠</span><span id="errMsg">Credenciales inválidas</span></div>
    <div class="lg-field">
      <label class="lg-label" for="username">Usuario</label>
      <input class="lg-input" type="text" id="username" name="username" placeholder="tu-marca" autocomplete="username" autocapitalize="none" autofocus required>
    </div>
    <div class="lg-field">
      <label class="lg-label" for="password">Contraseña</label>
      <input class="lg-input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="lg-submit" id="btn" type="submit">Entrar a mi portal</button>
  </form>

  <div class="lg-foot">Sesión válida · 12 horas</div>
</div>

<script>
const form = document.getElementById('loginForm');
const btn  = document.getElementById('btn');
const err  = document.getElementById('err');
const errMsg = document.getElementById('errMsg');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Validando…';
  try {
    const r = await fetch('/proveedores/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Error de autenticación');
    window.location.href = '/proveedores';
  } catch (e2) {
    errMsg.textContent = e2.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = original;
    document.getElementById('password').focus();
    document.getElementById('password').select();
  }
});
</script>
</body>
</html>
