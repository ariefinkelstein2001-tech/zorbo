<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorbo Admin — Panel interno</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0e;
  --surface:#121219;
  --surface2:#1a1a24;
  --surface3:#24242f;
  --gold:#e9c46a;
  --gold-bright:#f7e3a7;
  --gold-deep:#bf9b48;
  --gold-dim:rgba(233,196,106,.10);
  --gold-glow:rgba(233,196,106,.07);
  --gold-bd:rgba(233,196,106,.20);
  --gold-bd-h:rgba(233,196,106,.46);
  --text:#f1ede5;
  --muted:rgba(241,237,229,.58);
  --dim:rgba(241,237,229,.32);
  --border:rgba(255,255,255,.07);
  --green:#5cc98f;
  --green-dim:rgba(92,201,143,.12);
  --red:#e0654f;
  --red-dim:rgba(224,101,79,.14);
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --display:'Syne',var(--sans);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  min-height:100vh;
  background-image:
    radial-gradient(60rem 40rem at 80% -10%,var(--gold-glow),transparent),
    radial-gradient(50rem 35rem at -10% 110%,rgba(182,164,230,.05),transparent);
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#33333f}

/* ── HEADER ── */
.adm-header{
  display:flex;align-items:center;gap:1rem;
  padding:.75rem 1.4rem;border-bottom:1px solid var(--border);
  background:rgba(18,18,25,.85);backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:30;
}
.adm-brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;color:inherit}
.adm-brand img{height:34px;width:auto;object-fit:contain;display:block;filter:drop-shadow(0 2px 10px rgba(233,196,106,.18))}
@media(max-width:600px){.adm-brand img{height:28px}}
.adm-pipe{
  width:1px;height:22px;background:var(--border);margin:0 .15rem;flex-shrink:0;
}
.adm-sub{
  font-family:var(--display);font-size:.7rem;font-weight:600;
  color:var(--gold);letter-spacing:.22em;text-transform:uppercase;
}
@media(max-width:600px){.adm-sub{display:none}}
.adm-tag{
  margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border);padding:.3rem .65rem;border-radius:20px;
  white-space:nowrap;
}
@media(max-width:540px){.adm-tag{display:none}}
.adm-out{
  flex-shrink:0;cursor:pointer;
  background:var(--surface2);border:1px solid var(--gold-bd);color:var(--gold);
  font-family:var(--sans);font-size:.72rem;font-weight:700;letter-spacing:.06em;
  padding:.42rem .85rem;border-radius:20px;
  transition:border-color .2s,background .2s,color .2s;
}
.adm-out:hover{border-color:var(--gold-bd-h);background:var(--gold-dim)}

/* ── LAYOUT ── */
.adm-shell{
  display:grid;grid-template-columns:1fr 380px;gap:1.4rem;
  padding:1.4rem;max-width:1480px;margin:0 auto;
}
@media(max-width:1080px){
  .adm-shell{grid-template-columns:1fr;gap:1rem;padding:1rem}
}

/* ── TABS PILLS ── */
.adm-tabs{
  display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.1rem;
}
@media(max-width:600px){
  .adm-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:-.2rem -1rem 1rem;padding:.2rem 1rem}
  .adm-tabs::-webkit-scrollbar{display:none}
}
.adm-tab{
  flex-shrink:0;display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;
  font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.02em;
  background:transparent;color:var(--muted);border:1px solid var(--border);
  padding:.55rem 1rem;border-radius:22px;cursor:pointer;
  transition:border-color .18s,color .18s,background .18s,transform .12s;
}
.adm-tab .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.adm-tab:hover{border-color:var(--gold-bd-h);color:var(--text);background:var(--gold-dim)}
.adm-tab.on{
  background:linear-gradient(135deg,var(--gold-bright),var(--gold) 60%,var(--gold-deep));
  color:#1a1408;border-color:transparent;
  box-shadow:0 6px 18px rgba(233,196,106,.28);
}
.adm-tab.on .dot{background:#1a1408;opacity:.85}

/* ── EDITOR PANEL ── */
.adm-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.3rem;position:relative;
  transition:border-color .2s;
}
.adm-panel:hover{border-color:rgba(255,255,255,.10)}
.adm-panel-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;
  margin-bottom:1.2rem;padding-bottom:1.1rem;border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.adm-panel-title{
  font-family:var(--display);font-size:1.55rem;font-weight:800;letter-spacing:-.005em;line-height:1;
  background:linear-gradient(135deg,#fff8e6,var(--gold-bright) 60%,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.adm-panel-meta{font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-top:6px}
.adm-actions{display:flex;gap:.5rem;flex-shrink:0;align-items:center;flex-wrap:wrap}
.adm-btn{
  font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.04em;
  border:none;cursor:pointer;padding:.6rem 1rem;border-radius:11px;
  display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;
  transition:opacity .2s,transform .1s,background .2s,border-color .2s;
}
.adm-btn-gold{
  background:linear-gradient(135deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));
  color:#1a1408;box-shadow:0 6px 18px rgba(233,196,106,.20);
}
.adm-btn-gold:hover{opacity:.93}
.adm-btn-gold:active{transform:scale(.97)}
.adm-btn-gold:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.adm-btn-ghost{
  background:transparent;color:var(--muted);border:1px solid var(--border);
}
.adm-btn-ghost:hover{border-color:var(--gold-bd-h);color:var(--gold);background:var(--gold-dim)}

.adm-status{
  font-family:var(--mono);font-size:.7rem;
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.4rem .6rem;border-radius:8px;
}
.adm-status.ok{color:var(--green);background:var(--green-dim);border:1px solid rgba(92,201,143,.25)}
.adm-status.err{color:var(--red);background:var(--red-dim);border:1px solid rgba(224,101,79,.25)}
.adm-status.loading{color:var(--muted);background:var(--surface3)}
.adm-status.hidden{display:none}

/* ── BLOCKS ── */
.adm-blocks{display:flex;flex-direction:column;gap:.95rem}
.adm-block{
  background:var(--surface2);border:1px solid var(--gold-bd);border-radius:12px;
  padding:.95rem 1.05rem 1.1rem;
  transition:border-color .2s,box-shadow .2s;
}
.adm-block:hover{border-color:var(--gold-bd-h)}
.adm-block.dirty{
  border-color:var(--gold-bd-h);
  box-shadow:0 0 0 3px var(--gold-dim);
}
.adm-block-head{
  display:flex;align-items:center;gap:.65rem;margin-bottom:.65rem;
}
.adm-block-num{
  font-family:var(--mono);font-size:.62rem;color:var(--gold);
  background:var(--gold-dim);border:1px solid var(--gold-bd);
  padding:.22rem .5rem;border-radius:6px;flex-shrink:0;
  letter-spacing:.06em;
}
.adm-block-heading{
  flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);
  font-family:var(--display);font-size:1.08rem;font-weight:700;letter-spacing:-.005em;
  padding:.2rem 0;
}
.adm-block-heading:focus{color:var(--gold)}
.adm-block-heading::placeholder{color:var(--dim);font-style:italic;font-weight:500}
.adm-block-heading.intro{
  color:var(--dim);font-style:italic;font-weight:500;font-size:.85rem;
  pointer-events:none;font-family:var(--sans);
}
.adm-block-del{
  background:transparent;border:none;color:var(--dim);cursor:pointer;
  width:28px;height:28px;border-radius:7px;font-size:.95rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:color .15s,background .15s;
}
.adm-block-del:hover{color:var(--red);background:var(--red-dim)}
.adm-block-body{
  width:100%;min-height:90px;
  background:#0c0c12;color:var(--text);
  border:1px solid var(--border);border-radius:9px;
  font-family:var(--mono);font-size:13px;line-height:1.65;
  padding:.75rem .9rem;resize:vertical;outline:none;
  transition:border-color .15s;
}
.adm-block-body:focus{border-color:var(--gold-bd-h);background:#0e0e16}
.adm-block-body::placeholder{color:var(--dim)}

.adm-add-block{
  margin-top:.6rem;background:transparent;border:1px dashed var(--gold-bd);
  color:var(--muted);font-family:var(--sans);font-size:.78rem;font-weight:700;letter-spacing:.04em;
  padding:.75rem 1rem;border-radius:11px;cursor:pointer;width:100%;
  transition:border-color .15s,color .15s,background .15s;
}
.adm-add-block:hover{border-color:var(--gold-bd-h);color:var(--gold);background:var(--gold-dim)}

.adm-loading{padding:2.5rem;text-align:center;color:var(--muted);font-size:.85rem;font-family:var(--mono)}
.adm-empty{padding:1.5rem;text-align:center;color:var(--dim);font-size:.85rem}

/* ── CHAT PREVIEW ── */
.adm-chat{
  position:sticky;top:5.2rem;align-self:start;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;
  height:calc(100vh - 7.5rem);max-height:760px;min-height:500px;
  overflow:hidden;
}
@media(max-width:1080px){
  .adm-chat{position:static;height:auto;max-height:none;min-height:520px}
}
.adm-chat-head{
  padding:1rem 1.1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
}
.adm-chat-av{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;
  border:1px solid var(--gold-bd);background:var(--surface3);
}
.adm-chat-av img{width:100%;height:100%;object-fit:cover;display:block}
.adm-chat-title-col{display:flex;flex-direction:column;gap:2px;min-width:0}
.adm-chat-title{
  font-family:var(--display);font-size:.95rem;font-weight:800;letter-spacing:-.005em;
  display:flex;align-items:center;gap:.4rem;
}
.adm-chat-title .live{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);
}
.adm-chat-sub{font-family:var(--mono);font-size:.62rem;color:var(--dim);letter-spacing:.06em}
.adm-chat-mode{
  margin-left:auto;display:flex;gap:.25rem;
  background:var(--surface3);padding:3px;border-radius:9px;
}
.adm-mode{
  font-family:var(--sans);font-size:.65rem;font-weight:800;letter-spacing:.08em;
  background:transparent;border:none;color:var(--muted);cursor:pointer;
  padding:.38rem .7rem;border-radius:7px;transition:all .15s;
}
.adm-mode.on{
  background:linear-gradient(135deg,var(--gold-bright),var(--gold) 60%,var(--gold-deep));
  color:#1a1408;
}

.adm-chat-body{
  flex:1;overflow-y:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.9rem;
}
.adm-msg{display:flex;gap:.6rem;align-items:flex-start;max-width:92%}
.adm-msg.user{margin-left:auto;flex-direction:row-reverse}
.adm-msg-av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;
  border:1px solid var(--gold-bd);background:var(--surface3);
}
.adm-msg-av img{width:100%;height:100%;object-fit:cover;display:block}
.adm-msg.user .adm-msg-av{
  background:linear-gradient(135deg,var(--gold-dim),rgba(233,196,106,.04));
  border-color:var(--gold-bd-h);color:var(--gold);font-weight:700;
}
.adm-msg-col{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.adm-msg-sender{
  font-size:.62rem;color:var(--dim);letter-spacing:.06em;font-weight:600;
  padding:0 .2rem;
}
.adm-msg.user .adm-msg-sender{text-align:right}
.adm-msg-bubble{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:13px;border-bottom-left-radius:5px;
  padding:.6rem .85rem;font-size:.86rem;line-height:1.55;color:var(--text);
  white-space:pre-wrap;word-wrap:break-word;
}
.adm-msg.user .adm-msg-bubble{
  background:linear-gradient(135deg,var(--gold-dim),rgba(233,196,106,.04));
  border-color:var(--gold-bd);border-bottom-left-radius:13px;border-bottom-right-radius:5px;
}
.adm-typing .adm-msg-bubble{display:flex;gap:5px;padding:.75rem .95rem;align-items:center}
.adm-typing-dot{
  width:6px;height:6px;border-radius:50%;background:var(--dim);
  animation:tDot 1.2s infinite ease-in-out;
}
.adm-typing-dot:nth-child(2){animation-delay:.2s}
.adm-typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.adm-chat-empty{
  text-align:center;color:var(--dim);font-size:.78rem;padding:2rem 1rem;
  font-family:var(--sans);font-style:italic;line-height:1.5;
}

.adm-chat-foot{
  padding:.7rem;border-top:1px solid var(--border);
  display:flex;gap:.5rem;align-items:flex-end;background:var(--surface);
}
.adm-chat-in{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:11px;
  color:var(--text);font-family:var(--sans);font-size:.88rem;line-height:1.5;
  padding:.6rem .8rem;resize:none;outline:none;
  min-height:42px;max-height:120px;
  transition:border-color .15s;
}
.adm-chat-in:focus{border-color:var(--gold-bd-h)}
.adm-chat-in::placeholder{color:var(--dim)}
.adm-chat-send{
  background:linear-gradient(135deg,var(--gold-bright),var(--gold) 60%,var(--gold-deep));
  color:#1a1408;border:none;border-radius:11px;cursor:pointer;
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  transition:opacity .2s,transform .1s;flex-shrink:0;
  box-shadow:0 4px 14px rgba(233,196,106,.22);
}
.adm-chat-send:hover{opacity:.93}
.adm-chat-send:active{transform:scale(.95)}
.adm-chat-send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.adm-chat-clear{
  background:transparent;border:none;color:var(--dim);cursor:pointer;
  font-size:.68rem;font-family:var(--sans);font-weight:600;letter-spacing:.04em;
  padding:.55rem .65rem;border-radius:8px;
  transition:color .15s,background .15s;
}
.adm-chat-clear:hover{color:var(--red);background:var(--red-dim)}

/* ── TOAST ── */
.adm-toast{
  position:fixed;bottom:1.4rem;right:1.4rem;z-index:50;
  display:flex;align-items:center;gap:.6rem;
  background:var(--surface);border:1px solid var(--gold-bd-h);
  padding:.8rem 1.1rem;border-radius:12px;
  box-shadow:0 18px 44px rgba(0,0,0,.5);
  font-family:var(--sans);font-size:.85rem;color:var(--text);
  transform:translateY(20px) scale(.95);opacity:0;pointer-events:none;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s;
  max-width:90vw;
}
.adm-toast.show{transform:translateY(0) scale(1);opacity:1}
.adm-toast .adm-toast-ico{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;flex-shrink:0;
}
.adm-toast.ok .adm-toast-ico{background:var(--green-dim);color:var(--green)}
.adm-toast.err{border-color:var(--red)}
.adm-toast.err .adm-toast-ico{background:var(--red-dim);color:var(--red)}
</style>
</head>
<body>

<header class="adm-header">
  <a class="adm-brand" href="/admin" aria-label="ZORBO Admin">
    <img src="https://cdn.shopify.com/s/files/1/0668/0081/2327/files/Titulo_secundario-3.png?v=1779814975" alt="ZORBO">
  </a>
  <span class="adm-pipe"></span>
  <span class="adm-sub">Admin</span>
  <div class="adm-tag" id="tagBuild">cargando…</div>
  <button type="button" class="adm-out" id="btnLogout" title="Cerrar sesión">Salir</button>
</header>

<main class="adm-shell">
  <!-- Editor -->
  <section>
    <div class="adm-tabs" id="tabs"></div>
    <div class="adm-panel" id="panel">
      <div class="adm-panel-head">
        <div>
          <div class="adm-panel-title" id="panelTitle">—</div>
          <div class="adm-panel-meta" id="panelMeta">—</div>
        </div>
        <div class="adm-actions">
          <button class="adm-btn adm-btn-ghost" id="btnReload" type="button">Recargar</button>
          <button class="adm-btn adm-btn-gold" id="btnSave" type="button" disabled>Guardar</button>
          <span class="adm-status hidden" id="saveStatus"></span>
        </div>
      </div>
      <div class="adm-blocks" id="blocks">
        <div class="adm-loading">Cargando contenido…</div>
      </div>
      <button class="adm-add-block" id="btnAddBlock" type="button" style="display:none">+ Agregar bloque</button>
    </div>
  </section>

  <!-- Mini chat -->
  <aside class="adm-chat">
    <div class="adm-chat-head">
      <div class="adm-chat-av"><img src="/zorbot-avatar.jpg" alt="Zorbot"></div>
      <div class="adm-chat-title-col">
        <div class="adm-chat-title"><span class="live"></span> Zorbot · Preview</div>
        <div class="adm-chat-sub" id="chatModeLabel">MODO B2C · CATÁLOGO LIVE</div>
      </div>
      <div class="adm-chat-mode" role="tablist" aria-label="Modo de chat">
        <button class="adm-mode on" data-mode="b2c" type="button">B2C</button>
        <button class="adm-mode" data-mode="b2b" type="button">B2B</button>
      </div>
    </div>
    <div class="adm-chat-body" id="chatBody">
      <div class="adm-chat-empty">Editá un bloque, guardá los cambios y conversá con Zorbot acá para validar antes de soltarlo a producción.</div>
    </div>
    <div class="adm-chat-foot">
      <textarea class="adm-chat-in" id="chatIn" rows="1" placeholder="Conversa con Zorbot…"></textarea>
      <button class="adm-chat-clear" id="chatClear" type="button" title="Limpiar conversación">Limpiar</button>
      <button class="adm-chat-send" id="chatSend" type="button" aria-label="Enviar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </aside>
</main>

<div class="adm-toast" id="toast">
  <span class="adm-toast-ico" id="toastIco">✓</span>
  <span id="toastMsg">Guardado</span>
</div>

<script>
// ─── Secciones disponibles ──────────────────────────────────────────────────
const SECCIONES = [
  { id:'general',   label:'General',         desc:'identidad · tono · reglas globales' },
  { id:'kairos',    label:'Kairos Brewing',  desc:'cervezas artesanales' },
  { id:'firulais',  label:'Firulais',        desc:'cheladas craft' },
  { id:'banny',     label:'Banny',           desc:'destilados · RTD' },
  { id:'mayorista', label:'Mayoristas (B2B)',desc:'restaurantes · botillerías · eventos' },
];

let activeSeccion = 'general';
let originalContent = '';
let dirty = false;
let chatMode = 'b2c';
let chatSessionId = null;
let chatStreaming = false;

// ─── Tabs ───────────────────────────────────────────────────────────────────
function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = SECCIONES.map(s => `
    <button type="button" class="adm-tab ${s.id===activeSeccion?'on':''}" data-id="${s.id}">
      <span class="dot"></span>${s.label}
    </button>`).join('');
  wrap.querySelectorAll('.adm-tab').forEach(b => {
    b.onclick = () => selectSeccion(b.dataset.id);
  });
}

async function selectSeccion(id){
  if (dirty && !confirm('Tenés cambios sin guardar en esta sección. Descartar?')) return;
  activeSeccion = id;
  renderTabs();
  await loadSeccion();
}

// ─── Parse / serialize markdown ─────────────────────────────────────────────
function parseMd(md){
  const lines = md.split('\n');
  const blocks = [{ heading:'', body:'', intro:true }];
  let cur = blocks[0];
  for (const line of lines) {
    if (line.startsWith('## ')) {
      cur = { heading: line.slice(3).trim(), body:'', intro:false };
      blocks.push(cur);
    } else {
      cur.body += (cur.body ? '\n' : '') + line;
    }
  }
  for (const b of blocks) b.body = b.body.replace(/[\s\n]+$/, '');
  return blocks;
}

function serializeBlocks(blocks){
  return blocks.map(b => {
    const body = b.body.replace(/[\s\n]+$/, '');
    if (b.intro || !b.heading) return body;
    return `## ${b.heading}\n\n${body}`;
  }).join('\n\n') + '\n';
}

// ─── Render bloques ─────────────────────────────────────────────────────────
let blocks = [];
function renderBlocks(){
  const wrap = document.getElementById('blocks');
  document.getElementById('btnAddBlock').style.display = '';
  if (!blocks.length) {
    wrap.innerHTML = '<div class="adm-empty">Este archivo está vacío. Agregá un bloque para empezar.</div>';
    return;
  }
  wrap.innerHTML = blocks.map((b, i) => {
    const heading = b.intro
      ? `<input class="adm-block-heading intro" value="Introducción (encabezado # del archivo)" readonly>`
      : `<input class="adm-block-heading" data-idx="${i}" value="${escapeAttr(b.heading)}" placeholder="Encabezado del bloque…">`;
    const del = b.intro ? '' : `<button class="adm-block-del" data-idx="${i}" type="button" title="Eliminar bloque">✕</button>`;
    return `
      <div class="adm-block" data-idx="${i}">
        <div class="adm-block-head">
          <span class="adm-block-num">#${String(i).padStart(2,'0')}</span>
          ${heading}
          ${del}
        </div>
        <textarea class="adm-block-body" data-idx="${i}" rows="6" placeholder="Contenido del bloque (Markdown soportado)…">${escapeHtml(b.body)}</textarea>
      </div>`;
  }).join('');

  wrap.querySelectorAll('.adm-block-heading[data-idx]').forEach(inp => {
    inp.oninput = () => {
      blocks[+inp.dataset.idx].heading = inp.value;
      markDirty(inp.closest('.adm-block'));
    };
  });
  wrap.querySelectorAll('.adm-block-body').forEach(ta => {
    ta.oninput = () => {
      blocks[+ta.dataset.idx].body = ta.value;
      autosize(ta);
      markDirty(ta.closest('.adm-block'));
    };
    autosize(ta);
  });
  wrap.querySelectorAll('.adm-block-del').forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.dataset.idx;
      if (!confirm(`Eliminar el bloque "${blocks[idx].heading || '(sin título)'}"?`)) return;
      blocks.splice(idx, 1);
      setDirty(true);
      renderBlocks();
    };
  });
}

function autosize(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.max(90, ta.scrollHeight + 2) + 'px';
}

function markDirty(blockEl){
  if (blockEl) blockEl.classList.add('dirty');
  setDirty(true);
}
function setDirty(v){
  dirty = v;
  document.getElementById('btnSave').disabled = !v;
  if (!v) document.querySelectorAll('.adm-block.dirty').forEach(el => el.classList.remove('dirty'));
}

// ─── API ────────────────────────────────────────────────────────────────────
async function loadSeccion(){
  const seccion = SECCIONES.find(s => s.id === activeSeccion);
  document.getElementById('panelTitle').textContent = seccion.label;
  document.getElementById('panelMeta').textContent  = `prompts/${seccion.id}.md · ${seccion.desc}`;
  document.getElementById('blocks').innerHTML = '<div class="adm-loading">Cargando contenido…</div>';
  setDirty(false);
  try {
    const r = await fetch(`/admin/brand/${activeSeccion}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    originalContent = data.content || '';
    blocks = parseMd(originalContent);
    renderBlocks();
    updateBuildTag();
  } catch (e) {
    document.getElementById('blocks').innerHTML =
      `<div class="adm-empty" style="color:var(--red)">Error cargando: ${escapeHtml(e.message)}</div>`;
  }
}

async function saveSeccion(){
  const btn = document.getElementById('btnSave');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  status.className = 'adm-status loading';
  status.textContent = 'Guardando…';
  const contenido = serializeBlocks(blocks);
  try {
    const r = await fetch('/admin/save-brand', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ seccion: activeSeccion, contenido }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
    originalContent = contenido;
    setDirty(false);
    status.className = 'adm-status ok';
    status.textContent = `Guardado · ${data.bytes} bytes`;
    showToast(`Guardado ✓ — el bot ya está usando los cambios`, 'ok');
    updateBuildTag();
    setTimeout(() => status.classList.add('hidden'), 4000);
  } catch (e) {
    status.className = 'adm-status err';
    status.textContent = 'Error: ' + e.message;
    showToast('Error al guardar: ' + e.message, 'err');
    btn.disabled = false;
  }
}

function updateBuildTag(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('tagBuild').textContent = `Último read: ${hh}:${mm}`;
}

// ─── Add block ──────────────────────────────────────────────────────────────
document.getElementById('btnAddBlock').onclick = () => {
  blocks.push({ heading:'Nuevo bloque', body:'', intro:false });
  setDirty(true);
  renderBlocks();
  const inputs = document.querySelectorAll('.adm-block-heading[data-idx]');
  const last = inputs[inputs.length-1];
  if (last) { last.focus(); last.select(); }
};

document.getElementById('btnSave').onclick = saveSeccion;
document.getElementById('btnReload').onclick = () => {
  if (dirty && !confirm('Hay cambios sin guardar. Descartar y recargar?')) return;
  loadSeccion();
};

// ─── Chat preview ───────────────────────────────────────────────────────────
function botAvatarHtml(){
  return `<div class="adm-msg-av"><img src="/zorbot-avatar.jpg" alt="Zorbot"></div>`;
}
function userAvatarHtml(){
  return `<div class="adm-msg-av">tú</div>`;
}

function chatRow(role, text){
  const body = document.getElementById('chatBody');
  const empty = body.querySelector('.adm-chat-empty');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'adm-msg ' + role;
  row.innerHTML = `
    ${role==='bot' ? botAvatarHtml() : userAvatarHtml()}
    <div class="adm-msg-col">
      <div class="adm-msg-sender">${role==='bot' ? 'Zorbot' : 'Vos'}</div>
      <div class="adm-msg-bubble"></div>
    </div>`;
  row.querySelector('.adm-msg-bubble').textContent = text;
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  return row;
}
function typingRow(){
  const body = document.getElementById('chatBody');
  const empty = body.querySelector('.adm-chat-empty');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'adm-msg bot adm-typing';
  row.innerHTML = `
    ${botAvatarHtml()}
    <div class="adm-msg-col">
      <div class="adm-msg-sender">Zorbot</div>
      <div class="adm-msg-bubble">
        <span class="adm-typing-dot"></span>
        <span class="adm-typing-dot"></span>
        <span class="adm-typing-dot"></span>
      </div>
    </div>`;
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  return row;
}

async function chatSend(){
  if (chatStreaming) return;
  const inp = document.getElementById('chatIn');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  chatStreaming = true;
  document.getElementById('chatSend').disabled = true;
  chatRow('user', text);
  const tRow = typingRow();
  const bubble = tRow.querySelector('.adm-msg-bubble');

  try {
    const body = { message: text };
    if (chatSessionId) body.sessionId = chatSessionId;
    if (chatMode === 'b2b') body.mayorista = true;
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '', started = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6);
        if (raw === '[DONE]') continue;
        let obj; try { obj = JSON.parse(raw); } catch { continue; }
        if (obj.sessionId) chatSessionId = obj.sessionId;
        if (obj.delta) {
          if (!started) { tRow.classList.remove('adm-typing'); bubble.textContent = ''; started = true; }
          full += obj.delta;
          bubble.textContent = full;
          document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
        }
      }
    }
    if (!started) bubble.textContent = '(sin respuesta)';
  } catch (e) {
    tRow.classList.remove('adm-typing');
    bubble.textContent = 'Error: ' + e.message;
    bubble.style.color = 'var(--red)';
  } finally {
    chatStreaming = false;
    document.getElementById('chatSend').disabled = false;
  }
}

function updateChatModeLabel(){
  document.getElementById('chatModeLabel').textContent =
    chatMode === 'b2b' ? 'MODO B2B · KNOWLEDGE MAYORISTAS' : 'MODO B2C · CATÁLOGO LIVE';
}

document.getElementById('chatSend').onclick = chatSend;
document.getElementById('chatIn').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
});
document.getElementById('chatIn').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
});
document.getElementById('chatClear').onclick = () => {
  chatSessionId = null;
  document.getElementById('chatBody').innerHTML =
    '<div class="adm-chat-empty">Conversación limpia. Probá un cambio y volvé a chatear para validar.</div>';
};
document.querySelectorAll('.adm-mode').forEach(b => {
  b.onclick = () => {
    if (chatStreaming) return;
    chatMode = b.dataset.mode;
    chatSessionId = null;
    document.querySelectorAll('.adm-mode').forEach(x => x.classList.toggle('on', x === b));
    updateChatModeLabel();
    document.getElementById('chatBody').innerHTML =
      `<div class="adm-chat-empty">Modo ${chatMode.toUpperCase()} activo · sesión nueva. ${chatMode==='b2b'?'Probando knowledge de mayoristas.':'Probando knowledge B2C (general + 3 marcas).'}</div>`;
  };
});

// ─── Toast ──────────────────────────────────────────────────────────────────
let toastTmr;
function showToast(msg, kind){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIco').textContent = kind === 'err' ? '⚠' : '✓';
  t.classList.remove('ok','err'); t.classList.add(kind === 'err' ? 'err' : 'ok');
  t.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => t.classList.remove('show'), 3200);
}

// ─── Helpers ────────────────────────────────────────────────────────────────
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

// ─── Confirm leave ──────────────────────────────────────────────────────────
window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ─── Logout ─────────────────────────────────────────────────────────────────
document.getElementById('btnLogout').onclick = async () => {
  if (dirty && !confirm('Hay cambios sin guardar. Cerrar sesión igual?')) return;
  try { await fetch('/admin/logout', { method:'POST' }); } catch {}
  window.location.href = '/admin/login';
};

// Si una respuesta 401 aparece (sesión expirada), redirigí a login
const _fetch = window.fetch;
window.fetch = async (...args) => {
  const r = await _fetch(...args);
  if (r.status === 401) {
    window.location.href = '/admin/login';
    throw new Error('Sesión expirada');
  }
  return r;
};

// ─── Boot ───────────────────────────────────────────────────────────────────
updateChatModeLabel();
renderTabs();
loadSeccion();
</script>
