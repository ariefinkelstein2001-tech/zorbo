<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorbo Admin — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Mismo refinamiento "mate" que admin-views/admin.html — neutros con
     leve tinte azulado, dorado de acento intacto, sombras tintadas hacia
     el azul de marca. Ver comentario extendido allá. */
  --bg:#f7f8f9;
  --surface:#fff;
  --surface2:#f5f6f7;
  --surface3:#eceef0;
  --gold:#f5a623;
  --gold-bright:#ffb840;
  --gold-deep:#a05f00;
  --gold-dim:#fff3d6;
  --gold-bd:#f1c97b;
  --gold-bd-h:#f5a623;
  --text:#111;
  --muted:#555c6d;
  --dim:#636b7e;
  --border:#e2e3e7;
  --red:#d32323;
  --red-dim:#fdecec;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --display:'Syne',var(--sans);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(10,24,51,.06);
  --shadow-md:0 8px 24px rgba(10,24,51,.08);
  --shadow-lg:0 20px 48px rgba(10,24,51,.10);
  --dur-fast:150ms;
  --dur-base:200ms;
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px;border-radius:4px;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
html,body{min-height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
}

.lg-card{
  width:100%;max-width:410px;
  background:var(--surface);border:1px solid var(--gold-bd);border-radius:18px;
  padding:2.4rem 2rem 2rem;
  box-shadow:0 18px 50px rgba(0,0,0,.12);
  position:relative;overflow:hidden;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1);
}
.lg-card::before{display:none}
@keyframes popIn{
  0%{opacity:0;transform:scale(.96) translateY(8px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

.lg-brand{
  text-align:center;margin-bottom:1.6rem;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.lg-logo{
  height:50px;width:auto;object-fit:contain;display:block;
  filter:drop-shadow(0 4px 14px rgba(245,166,35,.25));
  margin-bottom:8px;
}
.lg-tag{
  font-family:var(--display);font-size:.7rem;font-weight:700;color:var(--gold);
  letter-spacing:.32em;text-transform:uppercase;
  background:var(--gold-dim);border:1px solid var(--gold-bd);
  padding:.32rem .8rem;border-radius:20px;
}
.lg-hint{
  font-size:.7rem;color:var(--dim);letter-spacing:.04em;margin-top:.5rem;
}

.lg-form{position:relative;display:flex;flex-direction:column;gap:.95rem;margin-top:.4rem}
.lg-field{display:flex;flex-direction:column;gap:.35rem}
.lg-label{
  font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:.14em;
  text-transform:uppercase;padding-left:.2rem;font-family:var(--sans);
}
.lg-input{
  background:#15151e;border:1px solid var(--border);border-radius:11px;
  padding:.8rem 1rem;color:#fff;font-family:var(--sans);font-size:.92rem;
  caret-color:#fff;outline:none;transition:border-color .18s,background .18s;
}
.lg-input::placeholder{color:#888}
.lg-input:focus{border-color:var(--gold-bd-h);background:#15151e;color:#fff}
/* Autofill: el navegador pinta su propio fondo claro; forzamos texto claro
   y bloqueamos el repintado para que el campo siga oscuro y legible. */
.lg-input:-webkit-autofill,
.lg-input:-webkit-autofill:hover,
.lg-input:-webkit-autofill:focus{
  -webkit-text-fill-color:#fff;
  caret-color:#fff;
  -webkit-box-shadow:0 0 0 1000px #15151e inset;
  box-shadow:0 0 0 1000px #15151e inset;
  transition:background-color 9999s ease-in-out 0s;
}

.lg-remember{
  display:flex;align-items:center;gap:.55rem;
  font-size:.78rem;color:var(--muted);cursor:pointer;user-select:none;
  padding-left:.2rem;margin-top:-.15rem;
}
.lg-remember input{
  width:16px;height:16px;accent-color:var(--gold);cursor:pointer;flex:none;
}

.lg-err{
  display:none;align-items:center;gap:.5rem;
  background:var(--red-dim);border:1px solid rgba(224,101,79,.28);color:var(--red);
  padding:.6rem .85rem;border-radius:9px;
  font-size:.78rem;font-weight:600;
}
.lg-err.show{display:flex}

.lg-submit{
  margin-top:.5rem;width:100%;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));
  color:#1a1408;border:none;border-radius:12px;
  padding:.9rem 1rem;font-family:var(--sans);font-size:.92rem;font-weight:700;letter-spacing:.04em;
  cursor:pointer;transition:box-shadow var(--dur-base) var(--ease),transform var(--dur-fast) var(--ease);
  box-shadow:0 8px 24px rgba(233,196,106,.22);
}
.lg-submit:hover{box-shadow:0 12px 32px rgba(233,196,106,.32);transform:translateY(-1px)}
.lg-submit:active{transform:scale(.98) translateY(0)}
.lg-submit:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

.lg-foot{
  margin-top:1.3rem;font-size:.66rem;color:var(--dim);text-align:center;letter-spacing:.06em;
  font-family:var(--display);font-weight:500;text-transform:uppercase;
}

@media (max-width:480px){
  .lg-card{padding:2rem 1.3rem 1.5rem}
  .lg-logo{height:42px}
}
</style>
</head>
<body>
<div class="lg-card">
  <div class="lg-brand">
    <img class="lg-logo" src="https://cdn.shopify.com/s/files/1/0668/0081/2327/files/Titulo_secundario-3.png?v=1779814975" alt="ZORBO">
    <span class="lg-tag">Admin · panel interno</span>
    <span class="lg-hint">Acceso restringido al equipo Zorbo</span>
  </div>

  <form class="lg-form" id="loginForm" autocomplete="on">
    <div class="lg-err" id="err" role="alert">
      <span>⚠</span><span id="errMsg">Credenciales inválidas</span>
    </div>

    <div class="lg-field">
      <label class="lg-label" for="username">Correo</label>
      <input class="lg-input" type="email" id="username" name="username"
             placeholder="tu@kairosdrinks.com" autocomplete="email" autofocus required>
    </div>

    <div class="lg-field">
      <label class="lg-label" for="password">Contraseña</label>
      <input class="lg-input" type="password" id="password" name="password"
             placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <label class="lg-remember" for="rememberMe">
      <input type="checkbox" id="rememberMe" checked>
      Recordar mi correo y contraseña en este equipo
    </label>

    <button class="lg-submit" id="btn" type="submit">Iniciar sesión</button>
  </form>

  <div class="lg-foot">Sesión válida · 12 horas</div>
</div>

<script>
const form = document.getElementById('loginForm');
const btn  = document.getElementById('btn');
const err  = document.getElementById('err');
const errMsg = document.getElementById('errMsg');
const uEl  = document.getElementById('username');
const pEl  = document.getElementById('password');
const rem  = document.getElementById('rememberMe');

// "Recordarme": guarda correo y clave en este equipo (localStorage). Es un panel
// interno, así que se ofrece por comodidad; los datos quedan solo en el navegador
// de este equipo (ofuscados, no cifrados). Si se destilda, se borra lo guardado.
const REMEMBER_KEY = 'zorbo_admin_login';
const enc = (s) => { try { return btoa(encodeURIComponent(s)); } catch (_) { return ''; } };
const dec = (s) => { try { return decodeURIComponent(atob(s)); } catch (_) { return ''; } };
try {
  const saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null');
  if (saved && saved.r) {
    uEl.value = dec(saved.u || '');
    pEl.value = dec(saved.p || '');
    rem.checked = true;
    if (uEl.value && pEl.value) setTimeout(() => btn.focus(), 60);
  } else if (saved === null) {
    rem.checked = true; // por defecto, recordar
  }
} catch (_) {}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.classList.remove('show');
  // Guardar / limpiar credenciales según "Recordarme".
  try {
    if (rem.checked) localStorage.setItem(REMEMBER_KEY, JSON.stringify({ u: enc(uEl.value), p: enc(pEl.value), r: true }));
    else localStorage.removeItem(REMEMBER_KEY);
  } catch (_) {}
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Validando…';
  try {
    const r = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: uEl.value,
        password: pEl.value,
      }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Error de autenticación');
    window.location.href = '/admin';
  } catch (e2) {
    errMsg.textContent = e2.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = original;
    document.getElementById('password').focus();
    document.getElementById('password').select();
  }
});
</script>
</body>
</html>
